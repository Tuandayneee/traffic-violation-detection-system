# Dataset Class Mapping for Traffic Violation Detection System

vehicles:
  nc: 4
  names:
    0: car
    1: motorcycle
    2: bus
    3: truck

traffic_light:
  nc: 4
  names:
    0: red
    1: yellow
    2: green
    3: red_arrow

license_plates:
  types:
    - civilian_white
    - commercial_yellow
    - government_blue
    - military_red
  format_regex:
    standard_car: '^[0-9]{2}[A-Z]{1,2}-[0-9]{4,5}$'
    standard_bike: '^[0-9]{2}-[A-Z0-9]{2}\s[0-9]{4,5}$'
