version: '3.8'

services:
  # 1. FastAPI REST API & Web Dashboard Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/traffic_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=/app/data/evidence
    volumes:
      - evidence_data:/app/data/evidence
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Celery Asynchronous Task Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "src.backend.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/traffic_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - evidence_data:/app/data/evidence
    depends_on:
      - redis
      - postgres

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: traffic_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=traffic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: traffic_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evidence_data:
